"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E8%92%82%E5%8D%A1%E6%B3%A2%20Lake%20Tekapo%20New%20Zealand\">蒂卡波<\/a>前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Aoraki%20Mount%20Cook%20New%20Zealand\">库克山<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1431\">从Fairlie的<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=9%20Gordon%20Street%20Fairlie%20New%20Zealand\">9 Gordon Street<\/a>出发，至<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Mount%20Cook%20Village%20New%20Zealand\">Mount Cook Village<\/a>约146 km / 1小时50分；直接到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=White%20Horse%20Hill%20New%20Zealand\">White Horse Hill<\/a>步道停车场约147 km / 1小时50分，未含沿途停车。若看蒂卡波日出，需要先从Fairlie提前出发。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1433\">🚗 Fairlie住宿 → 库克山村 · 146 km · 1小时50分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1436\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1437\">① <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Pukaki%20New%20Zealand\">普卡基湖<\/a>：电影级蓝色冰川湖水+库克山远景 | ② <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Pukaki%20New%20Zealand\">普卡基湖<\/a>畔拍摄点（SH80旁）<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1440\">上午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1441\">9:30 – 14:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1443\">🏔️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1445\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hooker%20Valley%20Track%20New%20Zealand\">Hooker Valley Track<\/a> 晨间徒步<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1447\">新西兰最美步道之一，约3.5小时往返（10km）。穿过3座吊桥，终点是<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hooker%20Lake%20New%20Zealand\">胡克湖<\/a>，湖面漂浮冰山，背景是<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Aoraki%20Mount%20Cook%20New%20Zealand\">库克山<\/a>峰（3724m）。体力好者可去，或改为缩短版走至第二座吊桥（约1.5h）。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1450\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1451\">第一座吊桥+<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Aoraki%20Mount%20Cook%20New%20Zealand\">库克山<\/a>雪峰倒影。胡克冰川湖畔浮冰与雪山。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1454\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1455\">16:00 –17:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1457\">🦆<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1459\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kea%20Point%20Track%20New%20Zealand\">Kea Point Track<\/a> / <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tasman%20Glacier%20Lake%20New%20Zealand\">塔斯曼冰川湖<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1460\">约1小时往返，终点可见塔斯曼冰川末端湖泊，可能看到啄羊鹦鹉Kea。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1463\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1464\">塔斯曼冰川末端湖泊浮冰全景。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1467\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:1469\">⭐<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1471\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Aoraki%20Mount%20Cook%20New%20Zealand\">库克山<\/a>游览后 → <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ben%20Ohau%20New%20Zealand\">Ben Ohau<\/a>住宿<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1472\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tasman%20Glacier%20New%20Zealand\">Tasman Glacier<\/a>停车场返回约84.7 km / 1小时11分；次日前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=W%C4%81naka%20Wanaka%20New%20Zealand\">Wānaka<\/a>约157 km / 2小时02分。末段含专用通道，入口以房东指引为准。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:1475\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=629%20Manuka%20Terrace%2C%20Ben%20Ohau%2C%20Canterbury%207999\">629 Manuka Terrace, Ben Ohau, Canterbury 7999<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1477\">￥3,356<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1478\">15:00 - 11:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "04", "title": "瓦纳卡", "date": "10月2日（周五）· 徒步山顶，寻找那棵孤独的树", "sub": "", "dist": "总计约251.1 km · 纯驾驶3小时49分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">04<\/div><div class=\"info\"><div class=\"title\">瓦纳卡<\/div><div class=\"sub\">10月2日（周五）· 徒步山顶，寻找那棵孤独的树<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约251.1 km · 纯驾驶3小时49分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1492\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1493\">7:30 – 11:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:1495\">🚗<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1497\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ben%20Ohau%20New%20Zealand\">Ben Ohau<\/a>住宿出发 · 经<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lindis%20Pass%20New%20Zealand\">Lindis Pass<\/a>前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%93%A6%E7%BA%B3%E5%8D%A1%20Wanaka%20New%20Zealand\">瓦纳卡<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1498\">Lindis Pass是南岛最美山路之一，高原草甸与起伏丘陵，春初青绿草皮刚刚复苏。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1500\">🚗 629 Manuka Terrace → Wānaka · 157 km · 2小时02分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1503\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1504\">Lindis Pass最高点（海拔971m），俯瞰黄绿色高原谷地。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1507\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1508\">11:00 –13:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:1510\">🌊<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1512\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Wanaka%2C%20New%20Zealand\">瓦纳卡湖畔<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=That%20Wanaka%20Tree%20Wanaka%20New%20Zealand\">孤独树<\/a> &amp; 午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1513\">推荐午餐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ritual%20Caf%C3%A9%20Wanaka%20New%20Zealand\">Ritual Café<\/a> 或 Francesca&#x27;s Italian Kitchen。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1516\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1517\">That <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Wanaka%20Wanaka%20New%20Zealand\">Wanaka<\/a> Tree（孤独树）：湖边一棵柳树伸入湖中，建议清晨或傍晚人少时拍摄，无风天有完美倒影。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1520\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1521\">13:30 –14:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1523\">🍷<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1525\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Rippon%20Wanaka%20New%20Zealand\">Rippon<\/a>酒庄<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1526\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Rippon%20Winery%20Wanaka%20New%20Zealand\">Rippon Winery<\/a> 是当地最知名的酒庄之一，葡萄园直接延伸到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%93%A6%E7%BA%B3%E5%8D%A1%20Wanaka%20New%20Zealand\">瓦纳卡<\/a>湖边 Our Travel Mix，有山有湖有葡萄藤的景色堪称绝美，10月春季葡萄园刚刚吐绿，非常好看。可免费进入品酒区消费。Central Otago产区的黑皮诺（Pinot Noir）是新西兰最好的之一。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1530\"><span class=\"field-label\">营业时间：<\/span>11:00 – 17:00<\/span><\/div><div class=\"info-meta\"><span class=\"source-text meta-primary\" data-figma-id=\"173:1532\">免费<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1533\">约30分钟，4–6款酒<\/span><\/div><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1536\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1537\">15:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1539\">🌊<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1541\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%93%A6%E7%BA%B3%E5%8D%A1%20Wanaka%20New%20Zealand\">瓦纳卡<\/a>湖面皮划艇/桨板 · 钓鱼<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1544\">🚣 皮划艇<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1546\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Paddle%20W%C4%81naka%20Wanaka%20New%20Zealand\">Paddle Wānaka<\/a>（最老牌）<\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1547\">NZD 35/人/小时起<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1552\">直接走进去租<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1551\">湖滨 Ardmore Street 与 Dungarvon Street 交叉口对面<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1554\">1小时：够划到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=That%20Wanaka%20Tree%20Wanaka%20New%20Zealand\">孤独树<\/a>再回来，轻松体验；2小时：可以划到Ruby Island（小岛）并稍作停留<\/span><\/div><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1557\">🎣 钓鱼<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1559\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hook%20W%C4%81naka%20Wanaka%20New%20Zealand\">Hook Wānaka<\/a>（小红书）<\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1560\">装备NZD 10/套、鱼NZD 35/公斤<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1565\">直接走进去租<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1564\"><span class=\"field-label\">地址：<\/span>49 Monteith Road, Albert Town<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1566\"><span class=\"field-label\">营业时间：<\/span>周三至周日 11:00 - 19:00（周一周二关门）<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1567\"><span class=\"field-label\">鱼种：<\/span>三文鱼中的劳斯莱斯——帝王鲑（Chinook salmon）<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1568\"><span class=\"field-label\">加工：<\/span>钓上来之后给工作人员加工，大约半小时完成<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1570\">瓦纳卡的钓鱼和<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kaikoura%2C%20New%20Zealand\">凯库拉<\/a>完全不同——在清澈见底的高山湖泊里钓鳟鱼和三文鱼，景色本身就值回票价。<\/span><\/div><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1573\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:1575\">🏨<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1577\">出发<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%9A%87%E5%90%8E%E9%95%87%20Queenstown%20New%20Zealand\">皇后镇<\/a> · 晚餐 &amp; 休息<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1578\">推荐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Rata%20Queenstown%20New%20Zealand\">Rata<\/a>（精致新西兰料理）、 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Botswana%20Butchery%20Queenstown%20New%20Zealand\">Botswana Butchery<\/a>（湖景牛排）、<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Pier%2019%20Queenstown%20New%20Zealand\">Pier 19<\/a>（湖畔，新鲜海鲜）或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Fergburger%20Queenstown%20New%20Zealand\">Fergburger<\/a>（当地著名汉堡，须排队）。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1580\">🚗 Wānaka → Queenstown · 68.5 km · 1小时10分（Crown Range Rd）<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:1583\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=60%20Fitzpatrick%20Road%2C%20The%20Sleepout%2C%20Dalefield%209371\">60 Fitzpatrick Road, The Sleepout, Dalefield 9371<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1585\">￥3,117（2晚）<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1586\">15:00 - 10:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "05", "title": "皇后镇（极限活动）", "date": "10月3日（周六）· 从天而降，再乘快艇破浪——最肾上腺素的一天", "sub": "", "dist": "总计约53.5 km · 纯驾驶1小时09分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">05<\/div><div class=\"info\"><div class=\"title\">皇后镇（极限活动）<\/div><div class=\"sub\">10月3日（周六）· 从天而降，再乘快艇破浪——最肾上腺素的一天<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约53.5 km · 纯驾驶1小时09分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1598\">上午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1599\">9:00 – 12:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1601\">🏹<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1603\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Arrowtown%2C%20New%20Zealand\">Arrowtown 淘金小镇<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1604\"><span class=\"bullet-line\">驱车约20分钟至<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%AE%AD%E9%95%87%20Arrowtown%20New%20Zealand\">箭镇<\/a>，新西兰保存最完好的淘金时代小镇。秋季（10月）路旁树木开始变色，金黄色法国梧桐大道极美。<\/span>\n<span class=\"bullet-line\">可参观<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Arrowtown%20Chinese%20Settlement%20Arrowtown%20New%20Zealand\">华人矿工村遗址<\/a>（免费）、<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lakes%20District%20Museum%20Arrowtown%20New%20Zealand\">箭镇博物馆<\/a>。<\/span><\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1607\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1608\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Arrow%20River%20Arrowtown%20New%20Zealand\">Arrow River<\/a>淘金河道与秋末残留金叶。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1611\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1612\">12:30–13:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1614\">🍔<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1616\">镇中心午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1617\">推荐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Fergburger%20Queenstown%20New%20Zealand\">Fergburger<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%9A%87%E5%90%8E%E9%95%87%20Queenstown%20New%20Zealand\">皇后镇<\/a>最著名汉堡，需排队）或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Vudu%20Caf%C3%A9%20Queenstown%20New%20Zealand\">Vudu Café<\/a>。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1620\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1621\">14:00–16:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaea\"><span class=\"source-text \" data-figma-id=\"173:1623\">🚤<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1625\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Shotover%20Jet%20Queenstown%20New%20Zealand\">Shotover Jet<\/a> 红色喷射快艇<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1626\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%9A%87%E5%90%8E%E9%95%87%20Queenstown%20New%20Zealand\">皇后镇<\/a>标志性项目！鲜红色快艇在<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Shotover%20Canyon%20Queenstown%20New%20Zealand\">夏特欧瓦峡谷<\/a>狭窄水道高速穿梭，贴着岩壁360°转圈，水花四溅。峡谷最窄处仅2-3米，肾上腺素爆表！全程约25分钟，候船+办理约1小时，计划预留2小时。<\/span><\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1629\">14:30<\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1632\">¥750/人<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1631\">约25分钟<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1633\">会全身湿透，备换洗衣物<\/span><\/div><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1636\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1637\">16:00 –18:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1639\">🚡<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1641\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Skyline%20Queenstown%20Gondola%2C%20New%20Zealand\">皇后镇天空缆车<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Bob%27s%20Peak%20Queenstown%20New%20Zealand\">鲍伯峰<\/a>观景<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1642\">乘坐 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Skyline%20Queenstown%20New%20Zealand\">Skyline<\/a> 缆车登上鲍伯峰（海拔440m），俯瞰<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Wakatipu%20New%20Zealand\">瓦卡蒂普湖<\/a>、皇后镇全景和远处雪山。黄昏时分光线绝佳，可留下山喝咖啡等待日落。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge free\" data-figma-id=\"173:1645\">💰 门票<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1646\">NZD 40/人<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1649\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1650\">山顶瞭望台，黄金时刻（17:00–18:00）光线最美。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1653\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:1655\">🥂<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1657\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%9A%87%E5%90%8E%E9%95%87%20Queenstown%20New%20Zealand\">皇后镇<\/a>晚餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1658\">推荐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Rata%20Queenstown%20New%20Zealand\">Rata<\/a>（精致新西兰料理）、 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Botswana%20Butchery%20Queenstown%20New%20Zealand\">Botswana Butchery<\/a>（湖景牛排）、<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Pier%2019%20Queenstown%20New%20Zealand\">Pier 19<\/a>（湖畔，新鲜海鲜）或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Fergburger%20Queenstown%20New%20Zealand\">Fergburger<\/a>（当地著名汉堡，须排队）。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:1661\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=60%20Fitzpatrick%20Road%2C%20The%20Sleepout%2C%20Dalefield%209371\">60 Fitzpatrick Road, The Sleepout, Dalefield 9371<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1663\">￥3,117（2晚）<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1664\">15:00 - 10:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "06", "title": "皇后镇 → 蒂阿瑙", "date": "10月4日（周日）· 上午自由游玩，傍晚向峡湾进发", "sub": "", "dist": "总计约275.8 km · 纯驾驶3小时58分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">06<\/div><div class=\"info\"><div class=\"title\">皇后镇 → 蒂阿瑙<\/div><div class=\"sub\">10月4日（周日）· 上午自由游玩，傍晚向峡湾进发<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约275.8 km · 纯驾驶3小时58分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1678\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1679\">8:00 – 11:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1681\">🚶<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1683\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E7%9A%87%E5%90%8E%E9%95%87%20Queenstown%20New%20Zealand\">皇后镇<\/a>周边自驾、徒步<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1684\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Queenstown%20Hill%20Time%20Walk%20Queenstown%20New%20Zealand\">Queenstown Hill Time Walk<\/a>（最方便）：起点在皇后镇市区的<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Belfast%20Street%20Queenstown%20New%20Zealand\">Belfast Street<\/a>，不需要开车。一路爬到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Basket%20of%20Dreams%20Queenstown%20New%20Zealand\">Basket of Dreams<\/a>雕塑和观景台，往返约2–3小时。<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Mt%20Crichton%20Loop%20Queenstown%20New%20Zealand\">Mt Crichton Loop<\/a>（内容最丰富）：起点位于皇后镇前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Glenorchy%20Queenstown%20New%20Zealand\">格林诺奇<\/a>的公路旁，距离皇后镇约12公里。路线经过森林、溪流、瀑布、淘金隧道和<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Sam%20Summers%20Queenstown%20New%20Zealand\">Sam Summers<\/a>百年小屋，环线约6.4公里、2–3小时。<\/span><\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1687\">上午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1688\">11:00 –12:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1690\">🏠<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1692\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Glenorchy%2C%20New%20Zealand\">Glenorchy 格林诺奇<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1693\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Wakatipu%20New%20Zealand\">Lake Wakatipu<\/a>尽头的雪山+草原，《指环王》取景地（Paradise区域）<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1695\">🚗 Queenstown → Glenorchy · 46 km · 50分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1698\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1699\">12:00 –14:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1701\">🍔<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1703\">出发前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E8%92%82%E9%98%BF%E7%91%99%20Te%20Anau%20New%20Zealand\">蒂阿瑙<\/a> / 途中午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1704\">可在Mossburn或Kingston小镇用餐补给（蒂阿瑙超市有限，提前备足食物）。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1706\">🚗 Glenorchy → 28 Lakefront Dr · 217 km · 2小时51分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1709\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1710\">14:00 –17:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1712\">🌊<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1714\">抵达<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E8%92%82%E9%98%BF%E7%91%99%20Te%20Anau%20New%20Zealand\">蒂阿瑙<\/a> &amp; <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Te%20Anau%20Te%20Anau%20New%20Zealand\">Te Anau<\/a>湖<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1715\">蒂阿瑙是进入峡湾国家公园的门户，Te Anau湖是南岛最大淡水湖。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1718\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1719\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lake%20Te%20Anau%20Te%20Anau%20New%20Zealand\">蒂阿瑙湖<\/a>畔远眺Murchison Mountains雪山。<\/span><\/div><\/div><\/div><div class=\"item fixed\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1722\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1723\">19:20 –22:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:1725\">✨<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1727\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Te%20Anau%20Glowworm%20Caves%20Te%20Anau%20New%20Zealand\">Te Anau Glowworm Caves<\/a> 萤火虫洞<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1728\">乘船游览萤火虫洞穴，数千只萤火虫在黑暗中发光如繁星。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1731\"><span class=\"field-label\">班次：<\/span>19:20<\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1734\">¥770/人<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1733\">约2.5小时<\/span><\/div><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1737\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:1739\">🏨<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1741\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E8%92%82%E9%98%BF%E7%91%99%20Te%20Anau%20New%20Zealand\">蒂阿瑙<\/a>晚餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1742\">推荐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The%20Fat%20Duck%20Te%20Anau%20New%20Zealand\">The Fat Duck<\/a> 或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Redcliff%20Restaurant%20Te%20Anau%20New%20Zealand\">Redcliff Restaurant<\/a>。⚠️ 明天需6:30出发，务必早睡！住宿推荐：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Te%20Anau%20Hotel%20%26%20Villas%20Te%20Anau%20New%20Zealand\">Te Anau Hotel &amp; Villas<\/a> 或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Distinction%20Te%20Anau%20Te%20Anau%20New%20Zealand\">Distinction Te Anau<\/a><\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:1745\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=28%20Lakefront%20Drive%2C%20Te%20Anau%2C%20Southland%209600\">28 Lakefront Drive, Te Anau, Southland 9600<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1747\">￥1,895<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1748\">15:00 - 11:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "07", "title": "帝阿瑙 → 但尼丁 · 赶海 + 野生动物", "date": "10月5日（周一）· Allans Beach 礁石采集 · 奥塔哥半岛黄昏", "sub": "", "dist": "总计约406.1 km · 纯驾驶6小时33分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">07<\/div><div class=\"info\"><div class=\"title\">帝阿瑙 → 但尼丁 · 赶海 + 野生动物<\/div><div class=\"sub\">10月5日（周一）· Allans Beach 礁石采集 · 奥塔哥半岛黄昏<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约406.1 km · 纯驾驶6小时33分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1762\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1763\">6:30 – 10:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:1765\">🚗<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1767\">驾车前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E4%BD%86%E5%B0%BC%E4%B8%81%20Dunedin%20New%20Zealand\">但尼丁<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1768\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=28%20Lakefront%20Drive%20Te%20Anau%20New%20Zealand\">28 Lakefront Drive<\/a>直接前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=481%20Hillside%20Road%20Dunedin%20New%20Zealand\">481 Hillside Road<\/a>的<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hunting%20%26%20Fishing%20Dunedin%20New%20Zealand\">Hunting &amp; Fishing<\/a>，约287 km / 3小时31分<\/span>\n<span class=\"bullet-line\">从店铺到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Allans%20Beach%20Dunedin%20New%20Zealand\">Allans Beach<\/a>停车场另需24.5 km / 35分，未含购物和休息。<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1770\">🚗 Te Anau → Dunedin · 287 km · 3小时32分<\/span><\/div><div class=\"note tip\"><span class=\"source-text \" data-figma-id=\"173:1772\">💡 抵达后先去 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hunting%20%26%20Fishing%20Dunedin%20New%20Zealand\">Hunting &amp; Fishing<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=481%20Hillside%20Rd%20Dunedin%20New%20Zealand\">481 Hillside Rd<\/a>）购置：撬刀、测量尺、网袋。店员熟悉本地海岸，可问当天潮水和哪个岩区kina最多。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1775\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1776\">10:30 – 12:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:1778\">🦪<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1780\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Allans%20Beach%20Dunedin%20New%20Zealand\">Allans Beach<\/a> 礁石赶海<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1781\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Otago%20Peninsula%20Dunedin%20New%20Zealand\">奥塔哥半岛<\/a>太平洋侧最佳赶海地。从停车场步行5分钟即达，向左走进入礁石区。退潮时礁石大面积暴露，资源丰富：<\/span>\n<span class=\"bullet-line\">Kina（海胆） — 礁石缝隙附生，剖开即可生吃，奶油金黄，是南岛最地道的现采现吃体验<\/span>\n<span class=\"bullet-line\">绿唇贻贝 Mussels — 礁石面大量生长，个大肉厚<\/span>\n<span class=\"bullet-line\">岩牡蛎 Rock Oysters — 中高潮带礁石附生，手撬即可<\/span>\n<span class=\"bullet-line\">Cockles / Tuatua（蛤类） — 礁石沙泥区可挖<\/span><\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1783\">South-East FMA 采集规则：<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1785\">Kina 每人每天限50个，贻贝/牡蛎 仅限自用，合理采量；每人只能采自己份额，不可代他人采集\n出发前查「NZ Fishing Rules」app 确认当日有无biotoxin警告<\/span><\/div><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1787\">⚠️ 出发前查好当天低潮时间（MetService / NZ Tides app），尽量在低潮前后1-2小时到达，礁石暴露最充分。穿防滑水鞋，礁石湿滑。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1790\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1791\">12:30 – 13:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1793\">🍽️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1795\">海边现采现吃<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1796\">在 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Allans%20Beach%20Dunedin%20New%20Zealand\">Allans Beach<\/a> 沙滩或礁石台上，带上柠檬和酱油，将刚採的 kina 剖开直接享用。这是南岛最正宗的 kaimoana 体验。剩余贻贝和牡蛎可带回酒店晚上烹饪。<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1798\">🌊 Kina 吃法：从底部开口，冲海水洗净，用小勺挖取内芯。口感类似海胆刺身，带清甜海水味。10月水温低，新鲜度极佳。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1801\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1802\">13:00 - 13:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1804\">🚗<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1806\">驾车前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Otago%20Peninsula%20Dunedin%20New%20Zealand\">奥塔哥半岛<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1807\">沿 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Portobello%20Road%20Dunedin%20New%20Zealand\">Portobello Road<\/a> 向半岛深处行驶，沿途可以随时停车看海景。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1809\">🚗 Allans Beach停车场 → Royal Albatross Centre · 17.4 km · 26分<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1811\">🚗 前往奥塔哥半岛两条路各有特点：\n沿海的 Portobello Road 路窄但风景更好，可以一路看海；\n内陆的 High Road（Highcliff Road）在山脊上行驶，俯瞰太平洋和半岛全景，视野开阔。\n推荐去程走沿海路，回程走山脊路，形成一个环线，全程约35公里，一个来回大约1.5小时纯驾驶时间。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1814\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1815\">14:00 –18:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:1817\">🦅<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1819\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Otago%20Peninsula%20Dunedin%20New%20Zealand\">奥塔哥半岛<\/a>看动物<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1820\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Royal%20Albatross%20Centre%20Dunedin%20New%20Zealand\">信天翁中心<\/a>，参加1小时导览观察信天翁（需提前预订好场次）<\/span>\n<span class=\"bullet-line\">信天翁导览结束后，顺道去附近的 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Victory%20Beach%20Dunedin%20New%20Zealand\">Victory Beach<\/a> 看海豹海狮，约30分钟（免费）<\/span>\n<span class=\"bullet-line\">驱车至 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Sandfly%20Bay%20Dunedin%20New%20Zealand\">Sandfly Bay<\/a>，步行下沙丘，等待黄眼企鹅傍晚上岸，约1小时（免费）<\/span>\n<span class=\"bullet-line\">回到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Royal%20Albatross%20Centre%20Dunedin%20New%20Zealand\">信天翁中心<\/a>下方的 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Pilots%20Beach%20Dunedin%20New%20Zealand\">Pilots Beach<\/a>，等待小蓝企鹅上岸，日落后约30-60分钟开始（免费、可选、几十只）<\/span><\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1823\">🐦 信天翁<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1825\">14:00 皇家<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Royal%20Albatross%20Centre%20Dunedin%20New%20Zealand\">信天翁中心<\/a>（Royal Albatross Centre）<\/span><\/div><div class=\"bx-row\"><span class=\"source-text source-price\" data-figma-id=\"173:1826\">约 NZD 55/人，含1小时导览<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1830\"><span class=\"field-label\">开放时间：<\/span>每天上午开始，最后一场通常下午4点前，旺季（9-11月）是繁殖季，可以看到雏鸟<\/span><\/div><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1832\">位于半岛最顶端的<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Taiaroa%20Head%20Dunedin%20New%20Zealand\">塔亚罗阿角<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Taiaroa%20Head%20Dunedin%20New%20Zealand\">Taiaroa Head<\/a>），是全球唯一在大陆上繁殖的皇家信天翁栖息地，翼展最大可达3.2米。需要跟随导览进入观察区，不能自己随便进。<\/span><\/div><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1835\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:1837\">🏨<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1839\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E4%BD%86%E5%B0%BC%E4%B8%81%20Dunedin%20New%20Zealand\">但尼丁<\/a>晚餐&amp;住宿<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1840\">返回市区约45分钟。晚餐推荐 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Etrusco%20at%20the%20Savoy%20Dunedin%20New%20Zealand\">Etrusco at the Savoy<\/a>（意式料理，历史建筑内，气氛极好，但尼丁本地人最爱）；或带采集的贻贝回酒店，用房间微波炉加热，配白葡萄酒。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:1843\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=7%20Alma%20Street%2C%20Dunedin%2C%20Otago%209012\">7 Alma Street, Dunedin, Otago 9012<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1845\">￥1,306<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1846\">15:00 - 10:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "08", "title": "但尼丁 → 奥马鲁 → 基督城", "date": "10月6日（周二）· Larnach Castle · 市区 · 奥马鲁白石建筑 · 夜抵基督城", "sub": "", "dist": "总计约398.2 km · 纯驾驶5小时31分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">08<\/div><div class=\"info\"><div class=\"title\">但尼丁 → 奥马鲁 → 基督城<\/div><div class=\"sub\">10月6日（周二）· Larnach Castle · 市区 · 奥马鲁白石建筑 · 夜抵基督城<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约398.2 km · 纯驾驶5小时31分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1860\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1861\">9:00 – 11:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1863\">🏰<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1865\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dunedin%2C%20New%20Zealand\">但尼丁市区<\/a>地标打卡<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1866\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Larnach%20Castle%20Dunedin%20New%20Zealand\">Larnach Castle<\/a>（新西兰唯一城堡）<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Baldwin%20Street%20Dunedin%20New%20Zealand\">Baldwin Street<\/a>（世界最陡街道，吉尼斯纪录）<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dunedin%20Railway%20Station%20Dunedin%20New%20Zealand\">但尼丁火车站<\/a>（弗莱明堡式建筑，南岛最美车站）<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=First%20Church%20of%20Otago%20Dunedin%20New%20Zealand\">First Church of Otago<\/a>（哥特式教堂）<\/span><\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1869\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1870\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dunedin%20Railway%20Station%20Dunedin%20New%20Zealand\">但尼丁火车站<\/a>正面，彩色马赛克地板。<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Baldwin%20Street%20Dunedin%20New%20Zealand\">Baldwin Street<\/a>顶部俯拍陡坡与远山。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1873\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1874\">12:00 – 14:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:1876\">🍽️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1878\">市区午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1879\">从城堡返回市区约30分钟。午餐推荐 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Vogel%20Street%20Dunedin%20New%20Zealand\">Vogel Street<\/a> 一带，<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dunedin%20Dunedin%20New%20Zealand\">Dunedin<\/a> Street Food 聚集，网红咖啡馆 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Mazagran%20Dunedin%20New%20Zealand\">Mazagran<\/a> 值得一试。饭后可随意逛：苏格兰风格火车站（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dunedin%20Railway%20Station%20Dunedin%20New%20Zealand\">Dunedin Railway Station<\/a>，免费入内）拍一张，<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The%20Octagon%20Dunedin%20New%20Zealand\">八角广场<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The%20Octagon%20Dunedin%20New%20Zealand\">The Octagon<\/a>）感受维多利亚市政风貌，都是步行距离内。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1882\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1883\">14:30 – 17:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1885\">🚗<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1887\">驾车前往<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E9%A9%AC%E9%B2%81%20Oamaru%20New%20Zealand\">奥马鲁<\/a> · 途中停靠 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Moeraki%20Boulders%20Oamaru%20New%20Zealand\">Moeraki Boulders<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1888\">途中可在 Moeraki Boulders（摩拉奇巨石）停留30分钟——海滩上散落数十个完美球形天然巨石，地质奇观，拍照效果极佳，免费参观。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1891\">🚗 Dunedin → Moeraki Boulders · 76.2 km · 1小时<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1894\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1895\">Moeraki Boulders（摩拉基球石）<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1898\">晚上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1899\">17:00 – 18:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:1901\">🏛️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1903\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E9%A9%AC%E9%B2%81%20Oamaru%20New%20Zealand\">奥马鲁<\/a> · 白石维多利亚建筑区<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1904\">新西兰保存最完好的19世纪维多利亚港口城区，全部由当地特产白色石灰石建造，气质独特。<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Thames%20Street%20Oamaru%20New%20Zealand\">Thames Street<\/a> 一带步行即可，有蒸汽朋克主题博物馆（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Steampunk%20HQ%20Oamaru%20New%20Zealand\">Steampunk HQ<\/a>）、老式自行车店和独立咖啡馆。在这里吃个晚饭再出发——推荐港边的 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Harbour%20Street%20Bakery%20Oamaru%20New%20Zealand\">Harbour Street Bakery<\/a> 或 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Riverstone%20Kitchen%20Oamaru%20New%20Zealand\">Riverstone Kitchen<\/a>（需订位）。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1906\">🚗 Moeraki Boulders → Oamaru · 37.6 km · 30分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1909\">晚上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1910\">18:30 – 22:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:1912\">🚗<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1914\">驾车北返<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%9F%BA%E7%9D%A3%E5%9F%8E%20Christchurch%20New%20Zealand\">基督城<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1915\">沿<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=State%20Highway%201%20New%20Zealand%20New%20Zealand\">SH1<\/a>经Canterbury大平原，开阔麦田与油菜花田（10月初花期）<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1917\">🚗 Oamaru → 424 Gloucester St · 249 km · 3小时07分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1920\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:192 gle.com/maps/search/?api=1&amp;query=14F%20/%201%20Emily%20Place%2C%20Auckland%20CBD%201010\">14F / 1 Emily Place, Auckland CBD 1010<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:1974\">￥1,194<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:1975\">15:00 - 10:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "10", "title": "奥克兰 · 23:45 飞上海", "date": "10月8日（周四）· 市区闲逛，晚上飞上海", "sub": "", "dist": "总计约32.5 km · 纯驾驶38分（市区按步行方案）", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">10<\/div><div class=\"info\"><div class=\"title\">奥克兰 · 23:45 飞上海<\/div><div class=\"sub\">10月8日（周四）· 市区闲逛，晚上飞上海<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约32.5 km · 纯驾驶38分（市区按步行方案）<\/span><\/div><\/div><\/div><div class=\"flight-details\"><div class=\"flight-segment\"><div class=\"flight-name\">CA5102 · 中国国航代码共享 / 实际承运：新西兰航空 NZ289<\/div><div class=\"flight-route\">10月8日 23:45 奥克兰 AKL 国际航站楼 I → 10月9日 06:55 上海浦东 PVG T2<\/div><div class=\"flight-duration\">飞行 12小时10分 · 次日抵达<\/div><\/div><div class=\"flight-note\">建议到达机场：10月8日 20:45，奥克兰国际航站楼（起飞前3小时）。<\/div><div class=\"flight-source\">2026 年 · 起降时间均为当地时间 · 根据携程已出票订单核对<\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1989\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1990\">8:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:1992\">🥣<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1994\">早餐 + <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20CBD%2C%20New%20Zealand\">奥克兰市区<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1995\"><span class=\"bullet-line\">在市中心咖啡馆吃早餐，推荐 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Odette%27s%20Eatery%20Auckland%20New%20Zealand\">Odette&#x27;s Eatery<\/a> 或随便找一家街边咖啡馆，奥克兰咖啡文化很好，随便进都不踩雷。<\/span>\n<span class=\"bullet-line\">餐后步行至<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Queen%20Street%20Auckland%20New%20Zealand\">皇后街<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Queen%20Street%20Auckland%20New%20Zealand\">Queen Street<\/a>），奥克兰主干道，感受一下北岛最大城市的城市氛围，和南岛小镇完全不同，高楼密集、多元文化、街头热闹。<\/span><\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1998\">上午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1999\">10:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:2001\">⛲<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2003\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Victoria%20Park%20Auckland%20New%20Zealand\">维多利亚公园<\/a> + 海港区散步<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2004\">从<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Sky%20Tower%20Auckland%20New%20Zealand\">天空塔<\/a>步行约15分钟到<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>港口区（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Viaduct%20Harbour%20Auckland%20New%20Zealand\">Viaduct Harbour<\/a>），这里是<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>最漂亮的滨水区，游艇密密麻麻停靠，咖啡馆和餐厅沿海排开，氛围很好。可以在港口边随便坐坐喝杯咖啡，看帆船进出。<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>绰号&quot;帆船之城&quot;，这里最能感受到。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:2007\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:2008\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Viaduct%20Harbour%20Auckland%20New%20Zealand\">Viaduct Harbour<\/a> 游艇+<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Sky%20Tower%20Auckland%20New%20Zealand\">天空塔<\/a>同框（经典构图）<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:2011\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:2012\">12:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:2014\">🍴<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2016\">午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2017\"><span class=\"bullet-line\">推荐就在 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Viaduct%20Harbour%20Auckland%20New%20Zealand\">Viaduct Harbour<\/a> 附近解决，选择很多：<\/span>\n<span class=\"bullet-line\">Fish &amp; Chips 在港口边吃，新西兰传统吃法<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Depot%20Eatery%20Auckland%20New%20Zealand\">Depot Eatery<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20Auckland%20New%20Zealand\">Auckland<\/a>中城，本地口碑极好的海鲜餐厅，需提前预订或等位）<\/span>\n<span class=\"bullet-line\">或直接在港口边的餐厅随便选，水准普遍不差<\/span><\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:2020\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:2021\">13:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:2025\">🛍️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2027\">购物<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2028\"><span class=\"bullet-line\">日常购物/纪念品：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Queen%20Street%20Auckland%20New%20Zealand\">皇后街<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Queen%20Street%20Auckland%20New%20Zealand\">Queen Street<\/a>）：主干道，Zara、H&amp;M、Kathmandu（新西兰本土户外品牌，比国内便宜不少）、药妆店都在这里，走路就能逛完。<\/span>\n<span class=\"bullet-line\">高端品牌：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Britomart%20Auckland%20New%20Zealand\">布里托马特<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Britomart%20Auckland%20New%20Zealand\">Britomart<\/a>）：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>最集中的轻奢街区，就在港口边，Coach、Tiffany、Ted Baker、Sandro等都在这里，街道很漂亮，逛着舒服。<\/span>\n<span class=\"bullet-line\">综合商场：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Westfield%20Newmarket%20Auckland%20New%20Zealand\">西菲尔德<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Westfield%20Newmarket%20Auckland%20New%20Zealand\">Westfield Newmarket<\/a>）：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>最大的购物中心，品牌最全，Gucci也在这里，地铁可直达。<\/span>\n<span class=\"bullet-line\">奥特莱斯：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dress-Smart%20Auckland%20New%20Zealand\">Dress-Smart<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Onehunga%20Auckland%20New%20Zealand\">Onehunga<\/a>）：折扣奥特莱斯，有部分品牌打折，但没有Gucci、LV这类顶奢，主要是轻奢和运动品牌，从市区打车约20分钟。<\/span><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2030\">新西兰购物并不便宜，没有退税制度（GST消费税15%不退），离开时也不能申请退税。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:2034\">🏛️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2036\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20War%20Memorial%20Museum%20Auckland%20New%20Zealand\">奥克兰博物馆<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20War%20Memorial%20Museum%20Auckland%20New%20Zealand\">Auckland War Memorial Museum<\/a>）+ <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20Domain%20Auckland%20New%20Zealand\">奥克兰域公园<\/a> + <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Parnell%20Rose%20Gardens%20Auckland%20New%20Zealand\">彭罗斯玫瑰园<\/a><\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2037\">强烈推荐，奥克兰最值得进去的室内景点。馆内有三个核心看点：新西兰自然历史（恐鸟标本、地质演化）、毛利文化展厅（全球最完整的毛利文物收藏之一，巨型战争独木舟极震撼）、二战纪念展。博物馆本身坐落在奥克兰域公园（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Auckland%20Domain%20Auckland%20New%20Zealand\">Auckland Domain<\/a>）内，周围草坪开阔，建筑外观也很气派。博物馆出来在域公园里散步，10月是春季，公园里各种花卉盛开，玫瑰园尤其漂亮。这是奥克兰市中心最大的绿地公园，可以彻底放松，为长途飞行养精蓄锐。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge time\" data-figma-id=\"173:2040\">🕙 3h<\/span><span class=\"source-text badge free\" data-figma-id=\"173:2042\">💰 门票<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:2043\">海外游客约 NZD 28/人；含毛利表演约 NZD 55<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:2046\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:2047\">16:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:2049\">☕️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2051\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%BA%9E%E6%A3%AE%E6%AF%94%20Auckland%20New%20Zealand\">庞森比<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ponsonby%20Auckland%20New%20Zealand\">Ponsonby<\/a>）咖啡街区 + 晚餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2052\">打车约10分钟到庞森比路（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ponsonby%20Road%20Auckland%20New%20Zealand\">Ponsonby Road<\/a>），<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>最有格调的街区，独立咖啡馆、精品店、餐厅密集。在这里喝一杯下午茶，买最后几件纪念品或本地设计师产品，感受<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E5%A5%A5%E5%85%8B%E5%85%B0%20Auckland%20New%20Zealand\">奥克兰<\/a>最有生活气息的一面。约1.5小时自由逛。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:2055\">晚上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:2056\">20:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:2058\">✈️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:2060\">前往奥克兰机场国际航站楼 · 23:45 飞上海<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:2061\">计划20:00从 Ponsonby Road 出发，建议20:45到达奥克兰机场国际航站楼 I。23:45搭乘 CA5102（实际承运新西兰航空 NZ289），10月9日06:55抵达上海浦东 T2。接驳与还车另留时间，以当日交通安排出发。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge time\" data-figma-id=\"173:2064\">🕙 45m<\/span><span class=\"source-text badge plain\" data-figma-id=\"173:2067\">💰 打车<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:2068\">约NZD 60-80<\/span><span class=\"source-text badge plain\" data-figma-id=\"173:2071\">💰 Airport Shuttle<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:2072\">约NZD 30-40<\/span><\/div><\/div><\/div>"}, {"num": "11", "title": "奥克兰 ✈ 上海", "date": "10月8日（周四）23:45 → 10月9日（周五）06:55", "sub": "", "dist": "", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#e05a2b\">11<\/div><div class=\"info\"><div class=\"title\">奥克兰 ✈ 上海<\/div><div class=\"sub\">10月8日（周四）23:45 → 10月9日（周五）06:55<\/div><\/div><\/div><div class=\"flight-details\"><div class=\"flight-segment\"><div class=\"flight-name\">CA5102 · 中国国航代码共享 / 实际承运：新西兰航空 NZ289<\/div><div class=\"flight-route\">10月8日 23:45 奥克兰 AKL 国际航站楼 I → 10月9日 06:55 上海浦东 PVG T2<\/div><div class=\"flight-duration\">飞行 12小时10分 · 次日抵达<\/div><\/div><div class=\"flight-note\">建议到达机场：10月8日 20:45，奥克兰国际航站楼（起飞前3小时）。<\/div><div class=\"flight-source\">2026 年 · 起降时间均为当地时间 · 根据携程已出票订单核对<\/div><\/div><\/div>", "sourceBody": ""}], "sourceStats": "", "sourceOverview": "<section class=\"travel-notes\" aria-label=\"天气与出行参考\"><h2>天气与出行参考<\/h2><p class=\"notes-sub\">新西兰 · 9月28日—10月8日 · 资料核对：2026-09-18<\/p><div class=\"travel-notes-grid\"><section class=\"travel-note\"><h3>🌤 天气与穿着<\/h3><p>9月底至10月初为春季，天气可在晴朗、降雨与偏冷之间变化。南岛湖区、山地与城市体感不同，建议准备保暖中层、防水外套和适合步行的鞋；观星另带保暖衣物。<\/p><p>本页提供季节参考，尚未列出整段旅程的逐日预报。徒步、观鲸和游船在出发前再核对目的地天气及运营通知。<\/p><p class=\"note-source\">季节资料：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.newzealand.com/nz/feature/discover-spring-in-new-zealand/\">新西兰旅游局春季指南<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.metservice.com/\">MetService 实时天气<\/a><\/p><\/section><section class=\"travel-note\"><h3>💱 当地汇率<\/h3><p class=\"rate-value\">1 NZD 新西兰元 ≈ ¥3.83265<\/p><p>100 NZD ≈ ¥383.27。人民币换算仅供预算参考，实际兑换、刷卡汇率及手续费以银行或支付机构结算为准。<\/p><p class=\"note-source\">2026-09-18 参考价 · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.rbnz.govt.nz/statistics/series/exchange-and-interest-rates/exchange-rates-and%20the%20trade%20weighted%20index\">新西兰储备银行 RBNZ<\/a><br>此为查询日快照，不自动更新；出发前可点击来源复查。<\/p><\/section><section class=\"travel-note\"><h3>🌅 日出与日落<\/h3><p>2026年行程代表地点，均为当地时间。山体遮挡、云层及实际拍摄点会影响见到太阳的时刻；其他城镇请单独查询。<\/p><div class=\"sun-table-wrap\"><table class=\"sun-table\"><thead><tr><th>地点 / 日期<\/th><th>日出<\/th><th>日落<\/th><\/tr><\/thead><tbody><tr><td>基督城 · 9月28日<\/td><td>07:08<\/td><td>19:32<\/td><\/tr><tr><td>皇后镇 · 10月3日<\/td><td>07:14<\/td><td>19:55<\/td><\/tr><tr><td>皇后镇 · 10月4日<\/td><td>07:12<\/td><td>19:56<\/td><\/tr><tr><td>奥克兰 · 10月8日<\/td><td>06:47<\/td><td>19:30<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note-source\">来源：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.timeanddate.com/sun/new-zealand/christchurch?month=9&amp;year=2026\">Christchurch<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.timeanddate.com/sun/new-zealand/queenstown?month=10&amp;year=2026\">Queenstown<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.timeanddate.com/sun/new-zealand/auckland?month=10&amp;year=2026\">Auckland<\/a><\/p><\/section><section class=\"travel-note\"><h3>💡 出行提醒<\/h3><ul><li><strong>时差：<\/strong>2026年9月27日开始夏令时；本次新西兰段为 NZDT（UTC+13），比北京时间快5小时。手机建议开启自动时区。<\/li><li><strong>徒步安排：<\/strong>出发前查看天气及步道开放情况，为下山留足白昼；遇不利条件调整路线。<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.doc.govt.nz/alerts\">DOC 步道提醒<\/a><\/li><li><strong>摄影与观星：<\/strong>日落不等于完全入夜；观星还需看云量和月光，夜间湖边注意保暖，提前安排返程。<\/li><li class=\"note-source\">时区依据：<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.govt.nz/browse/recreation-and-the-environment/daylight-saving/\">新西兰政府夏令时说明<\/a><\/li><\/ul><\/section><\/div><\/section>"}};
let curGuide='wa', curDay=-1;   // -1 = overview mode

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function gmap(addr){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);}

// linkify place-name substrings inside a title.
// `links` is an array of {text, query?} — text must appear verbatim in the title;
// query overrides the Google-Maps search term (defaults to text).
// Works on the RAW title, splitting on the link texts so nothing gets double-escaped.
function linkifyName(rawTitle, links){
  if(!links || !links.length) return esc(rawTitle);
  // build one regex of all link texts (longest first to avoid partial overlaps)
  const map = {};
  links.forEach(l=>{ map[l.text] = l.query || l.text; });
  const keys = Object.keys(map).sort((a,b)=>b.length-a.length);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp('('+keys.map(escRe).join('|')+')','g');
  let out='', last=0, m;
  while((m=re.exec(rawTitle))!==null){
    out += esc(rawTitle.slice(last, m.index));
    const t = m[1];
    out += `<a class="addr-link" href="${gmap(map[t])}" target="_blank" rel="noopener">${esc(t)}</a>`;
    last = m.index + t.length;
  }
  out += esc(rawTitle.slice(last));
  return out;
}

function render(){
  const g=DATA[curGuide];
  document.documentElement.style.setProperty('--accent',g.color);

  // switch
  document.getElementById('switch').innerHTML = Object.keys(DATA).map(k=>
    `<button class="${k===curGuide?'active':''}" onclick="pickGuide('${k}')">${DATA[k].region}·${DATA[k].route}</button>`).join('');

  // stats strip removed per design

  // overview card
  document.getElementById('ovIc').style.background = g.badge;
  document.getElementById('ovSub').textContent = `共 ${g.days.length} 个行程条目 · 查看路线总览地图`;

  // day list
  document.getElementById('dayList').innerHTML = g.days.map((d,i)=>{
    const dist = d.dist? `<div class="dist">${esc(d.dist)}${d.drive?' · '+esc(d.drive):''}</div>`:'';
    return `<div class="day-item ${i===curDay?'active':''}" onclick="pickDay(${i})">
      <div class="num" style="background:${g.badge}">${esc(d.num)}</div>
      <div class="meta"><div class="t">${esc(d.title)}</div>
      <div class="d">${esc(d.date)||esc(d.sub)}</div>${dist}</div></div>`;
  }).join('');

  // hero
  document.getElementById('hero').innerHTML =
    `<h1><span class="region">${esc(g.region)}</span><span class="route">${esc(g.route)}</span></h1>
     <div class="meta">${esc(g.meta)}</div>`;
  document.getElementById('mapimg').src = g.map;

  if(curDay<0) showOverview(); else showDay();
}

function showOverview(){
  document.getElementById('overviewView').style.display='';
  document.getElementById('dayView').style.display='none';
  document.getElementById('ovCard').classList.add('active');
  document.querySelectorAll('.day-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('mobileTitle').textContent = `${DATA[curGuide].region}·${DATA[curGuide].route} · 路线总览`;

  const g=DATA[curGuide];
  document.getElementById('ovBody').innerHTML =
    `<div class="ov-list">`+g.days.map((d,i)=>{
      const dist=d.dist?`<div class="ov-dist">${esc(d.dist)}${d.drive?' · '+esc(d.drive):''}</div>`:'';
      return `<div class="ov-row" onclick="pickDay(${i})">
        <div class="num" style="background:${g.badge}">${esc(d.num)}</div>
        <div class="ov-info"><div class="t">${esc(d.title)}</div>
          <div class="s">${esc(d.date)}${d.sub?" · "+esc(d.sub):""}</div>${dist}</div>
        </div>`;
    }).join('')+`</div>`+(g.sourceOverview||'');
  document.getElementById('main').scrollTop=0;
}

function showDay(){
  document.getElementById('overviewView').style.display='none';
  document.getElementById('dayView').style.display='';
  document.getElementById('ovCard').classList.remove('active');
  const d=DATA[curGuide].days[curDay];
  document.getElementById('mobileTitle').textContent = `${esc(d.num)} · ${d.title}`;
  renderDay();
}

function renderDay(){
  const d=DATA[curGuide].days[curDay];
  document.getElementById('dayHead').innerHTML=d.sourceHeader;
  document.getElementById('dayCard').innerHTML=d.sourceBody;
  document.getElementById('dayCard').hidden=!d.sourceBody.trim();
  document.getElementById('main').scrollTop=0;
}

function pickGuide(k){curGuide=k;curDay=-1;render();}
function pickOverview(){curDay=-1;showOverview();closeNav();}
function pickDay(i){
  curDay=i;showDay();
  document.querySelectorAll('.day-item').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  closeNav();
}
function openNav(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeNav(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}
function openMapZoom(){
  const src=document.getElementById('mapimg').src;
  if(!src) return;
  document.getElementById('mapLightboxImg').src=src;
  document.getElementById('mapLightbox').classList.add('open');
}
function closeMapZoom(){
  document.getElementById('mapLightbox').classList.remove('open');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMapZoom(); });

render();
</script>
</body>
</html>
