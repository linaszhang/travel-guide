<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行攻略 · 西澳北线 / 新西兰南岛</title>
<style>
:root{
  --bg:#f2f0ec;--card:#fff;--ink:#1a1a1a;--ink-2:#4a4a4a;--ink-3:#8a8a8a;--ink-4:#b3aea7;
  --line:#ececec;--line-2:#f3f2f0;--chip-bg:#eef1f6;--chip-ink:#5b6472;--price:#d81e5b;
  --accent:#e6007e;--sidebar:340px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh;}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar);flex:none;background:#fbfaf8;border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;overflow-y:auto;padding:12px 8px 40px;
}
.brand{font-family:"Songti SC","STSong",Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.04em;margin-bottom:4px;}
.brand .sub{font-family:inherit;font-size:12px;color:var(--ink-3);font-weight:400;letter-spacing:.06em;margin-top:6px;display:block;}

.guide-switch{display:flex;gap:8px;margin:20px 0 22px;background:#efece7;padding:5px;border-radius:12px;}
.guide-switch button{
  flex:1;border:none;background:transparent;padding:10px 6px;border-radius:9px;font-size:14px;font-weight:600;
  color:var(--ink-3);cursor:pointer;transition:.18s;font-family:inherit;
}
.guide-switch button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06);}

.ov-title{font-size:12px;color:var(--ink-4);letter-spacing:.14em;margin:8px 0 12px;font-weight:600;}
.stat-strip{display:flex;flex-wrap:wrap;gap:14px 8px;margin-bottom:22px;padding:16px;background:#fff;border-radius:14px;border:1px solid var(--line);}
.stat-strip .st{flex:1 1 40%;min-width:70px;}
.stat-strip .st .n{font-size:22px;font-weight:800;line-height:1;}
.stat-strip .st .l{font-size:11px;color:var(--ink-3);margin-top:5px;}

/* Overview entry (top of the always-visible day list) */
.ov-card{
  display:flex;align-items:center;gap:12px;padding:14px 12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;cursor:pointer;transition:.16s;user-select:none;margin-bottom:6px;
}
.ov-card:hover{background:#f4f2ef;}
.ov-card.active{border-color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.05);}
.ov-card .ic{
  width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;
}
.ov-card .tx{flex:1;min-width:0;}
.ov-card .tx .t{font-size:14px;font-weight:700;}
.ov-card.active .tx .t{color:var(--accent);}
.ov-card .tx .s{font-size:11px;color:var(--ink-3);margin-top:2px;}

.day-list{display:flex;flex-direction:column;gap:6px;}
.day-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 12px;border-radius:12px;cursor:pointer;
  transition:.16s;border:1px solid transparent;
}
.day-item:hover{background:#f4f2ef;}
.day-item.active{background:#fff;border-color:var(--line);box-shadow:0 3px 12px rgba(0,0,0,.05);}
.day-item .num{
  width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;
}
.day-item .meta{flex:1;min-width:0;}
.day-item .meta .t{font-size:14px;font-weight:600;line-height:1.4;}
.day-item .meta .d{font-size:11px;color:var(--ink-3);margin-top:3px;}
.day-item .meta .dist{font-size:11px;color:var(--ink-4);margin-top:4px;}
.day-item.active .meta .t{color:var(--accent);}

/* ===== Main ===== */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto;}
.hero{
  text-align:center;padding:70px 30px 50px;
  background:radial-gradient(120% 90% at 50% 0%,#f7f6f3 0%,#efece7 60%,#eae7e1 100%);
}
.hero h1{font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-weight:800;letter-spacing:.08em;line-height:1.14;}
.hero h1 .region{font-size:56px;display:block;}
.hero h1 .route{font-size:44px;display:block;margin-top:2px;color:var(--accent);}
.hero .meta{margin-top:22px;color:var(--ink-3);font-size:13px;letter-spacing:.04em;}

.mapwrap{max-width:760px;margin:-18px auto 30px;padding:0 24px;}
.map-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.06);}
/* trim ~2px on every edge to hide the image's black border (card clips the overflow) */
.map-card img{display:block;width:calc(100% + 4px);margin:-2px;cursor:zoom-in;}

/* map lightbox overlay */
.map-lightbox{
  display:none;position:fixed;inset:0;z-index:200;background:rgba(20,18,16,.9);
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.map-lightbox.open{display:flex;}
.map-lightbox img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 50px rgba(0,0,0,.5);}
.map-lightbox .lb-close{
  position:absolute;top:18px;right:22px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;border:none;font-size:22px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.map-lightbox .lb-close:hover{background:rgba(255,255,255,.28);}

.content{max-width:760px;margin:0 auto;padding:0 24px 90px;}
#dayView .content{padding-top:24px;}   /* comment 1: 24px gap above day header */

.day-head{
  background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 4px 16px rgba(0,0,0,.04);margin-bottom:18px;
}
.day-head .top{display:flex;align-items:flex-start;gap:14px;}
.day-head .num{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
.day-head .info{flex:1;min-width:0;}
.day-head .head-badge{flex:none;align-self:flex-start;background:#f0edfb;color:#6b4ea8;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;}
.day-head .title{font-size:19px;font-weight:700;}
.day-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:5px;}
/* comment 1: dist/drive laid out horizontally, left-aligned under the text, 12px gap */
.day-head .dist-line{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;font-size:11.5px;color:var(--ink-3);line-height:1.5;}
.route-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.route-tags .rt{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--chip-bg);color:var(--chip-ink);}
.route-tags .rt.free{background:#eaf3ec;color:#4a6b4a;}

.item{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line-2);}
.item:last-child{border-bottom:none;}
.item > .time{width:62px;flex:none;padding-top:2px;}
.item > .time .p{font-size:11.5px;color:var(--ink-3);}
.item > .time .r{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:2px;line-height:1.5;}
/* fixed-schedule activity: time shown in red (must arrive on time) */
.item.fixed > .time .r{color:var(--price);font-weight:700;}
.item.fixed > .time .p{color:var(--price);}
.item .icon{width:26px;height:26px;border-radius:8px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.item .body{flex:1;min-width:0;}
.item .name{font-size:15px;font-weight:700;}
.item .name .desc{color:var(--ink-2);font-weight:500;}
.item .para{font-size:13px;color:var(--ink-2);margin-top:6px;}
.item .link{font-size:12px;color:#3a6ea5;margin-top:6px;word-break:break-all;}
.item .addr{font-size:12px;color:var(--ink-3);margin-top:6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;}
.chip{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--chip-bg);color:var(--chip-ink);}
.chip.dist{background:#f0f0f0;color:#666;}
.price{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap;color:var(--price);}
.price .win{color:var(--ink-3);font-weight:500;font-size:11px;margin-left:6px;}

/* info-box: gray rounded card — key/value rows on top, accent hint wraps below, all left-aligned */
.info-box{
  display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:10px;
  background:#f4f2ef;border-radius:12px;padding:14px 18px;
}
.info-box .bx-rows{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;}
.info-box .bx-row{font-size:13px;color:var(--ink);line-height:1.5;}
.info-box .bx-k{color:var(--ink-3);margin-right:6px;}
.info-box .bx-v{color:var(--ink);}
.info-box .bx-right{
  flex:none;text-align:left;font-weight:700;font-size:13px;max-width:100%;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
}
.info-box .bx-right .price{margin-left:0;font-size:13px;}
.info-box .bx-right .bx-line{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:8px;}
.info-box .bx-right .win{color:#3a6ea5;font-size:13px;font-weight:600;}
.info-box .bx-right .bx-note{color:var(--ink-3);font-size:13px;font-weight:500;}
.addr-link{color:#3a6ea5;text-decoration:underline;text-underline-offset:2px;cursor:pointer;transition:.15s;}
.addr-link:hover{opacity:.75;}

/* feature badges (免费 / 45m / 拍照点 …) */
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:0 0 auto;white-space:nowrap;line-height:1.4;}
.badge.free{background:#e9f1fb;color:#2f6ad0;}
.badge.time{background:#eef1f6;color:#5b6472;}
.badge.photo{background:#eef6ee;color:#3d8a4a;}
.badge.plain{background:var(--chip-bg);color:var(--chip-ink);}
.badge-note{font-size:12.5px;color:var(--ink-2);margin-left:2px;}

@media(max-width:860px){
  .info-box{flex-wrap:wrap;gap:8px;padding:12px 14px;}
  .info-box .bx-right{flex:1 0 100%;justify-content:flex-start;}

  /* comment 1: on mobile, stack the item — time laid out horizontally ABOVE the
     title, everything left-aligned; icon sits inline with the name */
  .item{flex-wrap:wrap;gap:10px;}
  .item > .time{
    width:100%;flex:1 0 100%;order:-1;padding-top:0;
    display:flex;flex-direction:row;align-items:baseline;gap:8px;text-align:left;
  }
  .item > .time .p{font-size:12px;color:var(--ink-3);}
  .item > .time .r{margin-top:0;font-size:12px;color:var(--ink-2);font-weight:600;}
  .item.fixed > .time .p{color:var(--price);}
  .item.fixed > .time .r{color:var(--price);font-weight:700;}
  .item > .time .r:empty{display:none;}
  .item .icon{margin-top:2px;}
  .item .body{flex:1;min-width:0;}
}
.note{margin-top:9px;padding:9px 13px;border-radius:9px;font-size:12px;line-height:1.7;}
.note.info{background:#eef4fb;color:#3a5a7a;}
.note.tip{background:#eef7f0;color:#3d6b4a;}
.note.warn{background:#fdf3ee;color:#9a5a3a;}

.day-card{background:#fff;border-radius:16px;padding:8px 24px;box-shadow:0 4px 16px rgba(0,0,0,.04);}

/* Overview body — clickable day rows */
.ov-list{background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
.ov-row{display:flex;align-items:flex-start;gap:14px;padding:14px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.16s;border-radius:10px;}
.ov-row:last-child{border-bottom:none;}
.ov-row:hover{background:#f7f5f2;}
.ov-row .num{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.ov-row .ov-info{flex:1;min-width:0;}
.ov-row .ov-info .t{font-size:15px;font-weight:700;}
.ov-row .ov-info .s{font-size:12px;color:var(--ink-3);margin-top:3px;}
.ov-row .ov-dist{font-size:11.5px;color:var(--ink-4);margin-top:4px;}

/* mobile top bar + drawer (hidden on desktop) */
.mobile-bar{display:none;}
.hamburger{background:none;border:none;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;}
.hamburger span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:.2s;}
.nav-overlay{display:none;}

@media(max-width:860px){
  .app{flex-direction:column;}
  .main{height:auto;}
  .hero h1 .region{font-size:42px;}
  .hero h1 .route{font-size:34px;}

  /* fixed top bar with hamburger */
  .mobile-bar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:60;
    background:#fbfaf8;border-bottom:1px solid var(--line);padding:10px 16px;
  }
  .mobile-title{font-size:16px;font-weight:700;color:var(--ink);}

  /* sidebar becomes a slide-in drawer */
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;width:300px;max-width:86vw;z-index:80;
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:0 0 40px rgba(0,0,0,.18);overflow-y:auto;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar .brand{display:none;}          /* comment 1: hide brand */

  .nav-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .26s ease;
  }
  .nav-overlay.open{opacity:1;pointer-events:auto;}

  .hero{display:none;}                     /* comment 3: hide hero */
  .mapwrap{margin-top:16px;}

  /* comment 3 (this turn): tighten day-view content padding to 8px all around */
  #dayView .content{padding:8px;}

  /* keep the day number on the left of the text, never wrapping to its own line */
  .ov-row{gap:10px;padding:12px 10px;}
  .ov-row .ov-info{flex:1 1 auto;min-width:0;}
}

.flight-details{margin-top:20px;border-top:1px solid var(--line,#eee);padding-top:8px;font-size:13px;line-height:1.7;}
.flight-segment{padding:12px 0;border-bottom:1px solid var(--line,#eee);}.flight-name{font-weight:600;}.flight-route{margin-top:4px;}.flight-duration,.flight-source{font-size:12px;color:var(--ink-3);}.flight-note{margin-top:10px;}.flight-source{margin-top:12px;}
.source-text{white-space:pre-wrap;overflow-wrap:anywhere;}
.item>.time .source-text{white-space:nowrap;overflow-wrap:normal;}
.item>.time{min-width:102px;}
.price-note-row{display:flex;flex-wrap:nowrap;align-items:baseline;gap:8px;}
.price-note-row .source-text{white-space:nowrap;}
.badge{background:var(--chip-bg);color:var(--chip-ink);}
@media(max-width:860px){.item>.time{padding-left:36px;} }
.source-header-extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.source-price{font-weight:700;color:var(--price);}
.source-map-copy{margin-bottom:18px;padding:16px;background:white;border-radius:12px;}
.source-map-copy summary{cursor:pointer;font-weight:600;}
.stat-strip{align-items:center;}
.item .body .chip{display:block;margin-top:10px;}
@media(max-width:600px){.item{gap:8px}.item>.time{width:62px;padding-left:34px}.day-head{padding:18px 14px}}
.day-card[hidden]{display:none;}
.info-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;line-height:1.6;}
.info-meta .meta-detail{margin-left:auto;text-align:right;color:var(--ink-3);font-size:12px;white-space:normal;}
.info-meta .source-price,.info-meta .meta-primary{flex:0 1 auto;}
.info-meta .meta-detail{flex:0 1 auto;}
/* Shared typography and alignment for every itinerary card. */
.item{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:14px;row-gap:10px;}
.item>.time{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:14px;width:auto;min-width:0;padding:0;margin:0;order:0;}
.item>.time .p{grid-column:1;font-size:12px;white-space:nowrap;}
.item>.time .r{grid-column:2;font-size:12px;margin:0;}
.item>.icon{grid-column:1;grid-row:2;margin-top:1px;}
.item>.body{grid-column:2;grid-row:2;}
.item .para,.item .info-box,.item .bx-row,.item .price-note-row,.item .source-price,.item .bx-note{font-size:13px;line-height:1.6;}
.item .badge,.item .badge-note,.item .note{font-size:12px;line-height:1.6;}
.item .body .chip{display:table;width:fit-content;max-width:100%;margin-top:10px;font-size:11px;line-height:1.6;}
.field-label,.stay-window,.price-note-row .bx-note{color:var(--ink-3);font-weight:400;}
.stay-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.stay-meta>.source-text{white-space:nowrap;}
.stay-window{margin-left:auto;text-align:right;font-size:12px;}
.bullet-line{display:list-item;margin-left:1.2em;padding-left:0.1em;white-space:normal;}
.paragraph-copy:has(.bullet-line){white-space:normal;}
.price-note-row{font-size:13px;}
@media(max-width:860px){.item,.item>.time{column-gap:10px;}}
@media(max-width:600px){.item,.item>.time{column-gap:8px;}.price-note-row{gap:6px;}.price-note-row .bx-note{white-space:normal;}}
.travel-notes{margin-top:28px;padding:24px;background:#fff;border-radius:18px;}.travel-notes h2{font-size:18px;margin:0 0 6px;}.notes-sub,.note-source{font-size:12px;color:var(--ink-3);line-height:1.7;}.travel-notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:20px;}.travel-note{min-width:0;}.travel-note h3{font-size:14px;margin:0 0 12px;}.travel-note p,.travel-note li{font-size:13px;line-height:1.8;margin:8px 0;}.travel-note .note-source{font-size:12px;}.travel-note ul{padding-left:18px;margin:0;}.rate-value{font-weight:600;}.sun-table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.7;}.sun-table td,.sun-table th{text-align:left;padding:8px 4px;border-bottom:1px solid #eee;}.sun-table th{color:var(--ink-3);font-weight:400;}.sun-table td:not(:first-child){white-space:nowrap;font-variant-numeric:tabular-nums;}@media(max-width:700px){.travel-notes-grid{grid-template-columns:1fr;}.travel-notes{padding:18px 14px;}}
/* One shared tag size, with semantic colors retained. */
.item .badge,.item .body .chip,.source-header-extra .chip{font-size:12px;line-height:20px;padding:3px 9px;min-height:26px;box-sizing:border-box;border-radius:6px;font-weight:400;}
.item .badge{white-space:normal;}
.item .badges:has(>.photo){display:flex;flex-wrap:nowrap;align-items:flex-start;gap:10px;}
.item .badges>.photo{white-space:nowrap;flex:0 0 auto;}
.item .badges:has(>.photo)>.badge-note{flex:1;min-width:0;margin:0;line-height:20px;padding-top:3px;font-size:12px;}
.item .badge.free{color:#2f6ad0;background:#e9f1fb;}
</style>
</head>
<body>
<div class="mobile-bar" id="mobileBar">
  <button class="hamburger" id="hamBtn" onclick="openNav()" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-title" id="mobileTitle">路线总览</div>
</div>
<div class="nav-overlay" id="navOverlay" onclick="closeNav()"></div>
<div class="map-lightbox" id="mapLightbox" onclick="closeMapZoom()">
  <button class="lb-close" onclick="closeMapZoom()" aria-label="关闭">×</button>
  <img id="mapLightboxImg" alt="路线图放大">
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">旅行攻略<span class="sub">澳新自驾 · 交互行程手册</span></div>
    <div class="guide-switch" id="switch"></div>
    <div class="ov-card" id="ovCard" onclick="pickOverview()">
      <div class="ic" id="ovIc">🗺️</div>
      <div class="tx"><div class="t">路线总览 Overview</div><div class="s" id="ovSub"></div></div>
    </div>
    <div class="day-list" id="dayList"></div>
  </aside>

  <main class="main" id="main">
    <div class="hero" id="hero"></div>
    <div id="overviewView">
      <div class="mapwrap"><div class="map-card"><img id="mapimg" alt="路线图" onclick="openMapZoom()"></div></div>
      <div class="content"><div id="ovBody"></div></div>
    </div>
    <div id="dayView" style="display:none">
      <div class="content">
        <div id="dayHead"></div>
        <div class="day-card" id="dayCard"></div>
      </div>
    </div>
  </main>

pan><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:627\">上午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:628\">9:30 – 12:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:630\">🦭<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:632\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jurien%20Bay%20Jurien%20Bay%20WA\">Jurien Bay<\/a> · 野生澳洲海狮<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:633\"><span class=\"bullet-line\">澳洲海狮全球仅约1.2万只，是珊瑚海岸最难复制的野生动物互动体验<\/span>\n<span class=\"bullet-line\">从 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jurien%20Bay%20Boat%20Harbour%20Jurien%20Bay%20WA\">Jurien Bay Boat Harbour<\/a> 出发，15分钟船程抵 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Essex%20Rocks%20Jurien%20Bay%20WA\">Essex Rocks<\/a>，海狮好奇心极强，会主动游向浮潜者近距离对视<\/span><\/span><\/div><div class=\"note tip\"><span class=\"source-text \" data-figma-id=\"173:635\">💡 9月是座头鲸迁徙季，船上可能同时目睹鲸鱼跃水<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:637\">🚗 Lancelin沙丘 → Jurien Bay码头 · 112 km · 1小时13分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:640\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:641\">13:00 –15:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaea\"><span class=\"source-text \" data-figma-id=\"173:643\">🦞<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:645\"> text \" data-figma-id=\"173:669\">🌄<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:671\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The%20Pinnacles%20Desert%20Nambung%20National%20Park%20WA\">The Pinnacles Desert<\/a> · 黄昏石柱群<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:672\"><span class=\"bullet-line\">数千根高达3.5米的石灰岩石柱从金黄沙地拔起，黄昏斜光是全天最佳摄影时段<\/span>\n<span class=\"bullet-line\">自驾4.5公里环形路（随停随拍）+ <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Desert%20View%20Trail%20The%20Pinnacles%20Nambung%20National%20Park%20WA\">Desert View 步行道<\/a>，约1.5小时<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:674\">🚗 Lobster Shack → Pinnacles Discovery Centre · 20.3 km · 19分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge time\" data-figma-id=\"173:677\">🕙 1.5h<\/span><span class=\"source-text badge free\" data-figma-id=\"173:679\">🎫 门票<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:680\">WA国家公园5日通票<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:683\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:684\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Desert%20View%20Nambung%20National%20Park%20WA\">Desert View<\/a>台俯拍全貌 · 黄昏金光打金沙石柱<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:687\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:689\">🍽️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:691\">抵达 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Geraldton%20Australia\">Geraldton<\/a> · 晚餐 + 过夜<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:692\">补充次日物资（超市、加油），简单晚餐后休息<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:695\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=50%20Phelps%20Street%2C%20Geraldton%20WA%206530\">50 Phelps Street, Geraldton WA 6530<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:697\">￥1,792<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:698\">15:00 - 10:00<\/span><\/div><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:700\">🚗 Pinnacles → 50 Phelps St · 239 km · 2小时36分<\/span><\/div><\/div><\/div>"}, {"num": "02", "title": "粉湖 Hutt Lagoon → Kalbarri 海岸峭壁全线", "date": "9月24日（周四）· 盐湖泛着玫红，红岩悬在海浪之上", "sub": "", "dist": "暂估317.7 km · 纯驾驶3小时57分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#185FA5\">02<\/div><div class=\"info\"><div class=\"title\">粉湖 Hutt Lagoon → Kalbarri 海岸峭壁全线<\/div><div class=\"sub\">9月24日（周四）· 盐湖泛着玫红，红岩悬在海浪之上<\/div><div class=\"source-header-extra\"><span class=\"chip\">暂估317.7 km · 纯驾驶3小时57分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:729\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:730\">8:00 – 10:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fdeaf3\"><span class=\"source-text \" data-figma-id=\"173:732\">🌊<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:734\">出发 → <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hutt%20Lagoon%20Port%20Gregory%20WA\">Hutt Lagoon<\/a> <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hutt%20Lagoon%20Port%20Gregory%20WA\">粉湖<\/a>（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Port%20Gregory%20Port%20Gregory%20WA\">Port Gregory<\/a>）<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:735\"><span class=\"bullet-line\">世界最大微藻生产湖，70平方公里，由 Dunaliella salina 藻类产生粉红至玫红色；9月冬雨后水位最高、颜色最鲜艳<\/span>\n<span class=\"bullet-line\">沿 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Port%20Gregory%20Road%20Port%20Gregory%20WA\">Port Gregory Road<\/a> 西侧有多个停车点，<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Pink%20Lake%20Lookout%20Port%20Gregory%20WA\">Pink Lake Lookout<\/a> 为最佳机位；往左绕行可拍到粉湖+蓝色印度洋双背景构图<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:737\">🚗 50 Phelps St → Pink Lake Lookout · 96.7 km · 1小时10分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:740\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:741\">Lookout 左侧绕行角度最佳 · 粉湖+印度洋双色背景 · 无人机俯拍全湖鸟瞰<\/span><\/div><div class=\"note tip\"><span class=\"source-text \" data-figma-id=\"173:743\">💡 晴天上午10点光线最强色彩最饱和；盐结晶令皮肤反光，人像效果极好<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:746\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:747\">11:00–12:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:749\">🍽<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:751\">抵达 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%2C%20WA\">Kalbarri 镇<\/a> · 午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:752\"> Kalbarri 镇餐厅午餐（<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gorges%20Caf%C3%A9%20Kalbarri%20WA\">Gorges Café<\/a> 河景座位 / <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Black%20Rock%20Caf%C3%A9%20Kalbarri%20WA\">Black Rock Café<\/a> 本地鱼类）<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:754\">🚗 Pink Lake Lookout → Kalbarri · 66.9 km · 46分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:757\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:758\">13:00 - 16:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:760\">🌊<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:762\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%20Coastal%20Cliffs%2C%20WA\">Kalbarri 海岸峭壁<\/a>全线<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:763\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%20National%20Park%20Kalbarri%20WA\">卡尔巴里国家公园<\/a>海岸段全部免费，20公里海岸线设多个停靠点，从南往北依次游览<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Red%20Bluff%20Kalbarri%20WA\">Red Bluff<\/a>：最具代表性的锈红砂岩峭壁，直插印度洋，270度无遮挡海景；步行至崖边约5分钟<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Eagle%20Gorge%20Kalbarri%20WA\">Eagle Gorge<\/a>：海浪涌入岩石峡湾，翡翠色浪与橙红峭壁形成强烈色彩冲撞，是全段最戏剧性的景点<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Natural%20Bridge%20Kalbarri%20WA\">Natural Bridge<\/a>：天然拱形岩桥横跨海湾，是整段海岸最独特的地质地貌，步行约5分钟抵达<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Island%20Rock%20Kalbarri%20WA\">Island Rock<\/a>：海中孤立岩柱，可从悬崖边拍摄全景对比构图<\/span><\/span><\/div><div class=\"badges\"><span class=\"source-text badge time\" data-figma-id=\"173:766\">🕙 3h<\/span><span class=\"source-text badge free\" data-figma-id=\"173:768\">🎫 免费<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:771\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:772\">下午4–5点是最佳摄影时段，红岩在橙光下色彩最浓烈<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:775\">晚上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:776\">17:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:778\">🌇<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:780\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%20Kalbarri%20WA\">Kalbarri<\/a> 河口日落 + 晚餐 + 过夜<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:781\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Kalbarri%20WA\">Murchison River<\/a> 入海口看日落（约18:10），9月可能目睹迁徙座头鲸；之后镇内晚餐<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:784\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:785\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Mouth%20Kalbarri%20WA\">Murchison 河口<\/a>橙光倒影日落<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text stay-address\" data-figma-id=\"173:788\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Unit%201/24%20Hasleby%20Street%2C%20Kalbarri%20WA%206536\">Unit 1/24 Hasleby Street, Kalbarri WA 6536<\/a><\/span><\/div><div class=\"info-meta\"><span class=\"source-text source-price\" data-figma-id=\"173:790\">￥3,410（2晚）<\/span><span class=\"source-text meta-detail\" data-figma-id=\"173:791\">14:00 - 10:00<\/span><\/div><\/div><\/div><\/div>"}, {"num": "03", "title": "Kalbarri 国家公园内陆峡谷", "date": "9月25日（周五）· 走进亿年红岩，悬空百米俯望大地的弯曲", "sub": "", "dist": "总计约218.1 km · 纯驾驶2小时59分", "drive": "", "items": [], "sourceHeader": "<div class=\"day-head\"><div class=\"top\"><div class=\"num\" style=\"background:#185FA5\">03<\/div><div class=\"info\"><div class=\"title\">Kalbarri 国家公园内陆峡谷<\/div><div class=\"sub\">9月25日（周五）· 走进亿年红岩，悬空百米俯望大地的弯曲<\/div><div class=\"source-header-extra\"><span class=\"chip\">总计约218.1 km · 纯驾驶2小时59分<\/span><\/div><\/div><\/div><\/div>", "sourceBody": "<div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:820\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:821\">6:30 - 9:30<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:823\">🌄<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:825\">出发 → <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Nature%27s%20Window%20Kalbarri%20WA\">Nature&#x27;s Window<\/a> · 日出时分入园<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:826\"><span class=\"bullet-line\">Nature&#x27;s Window 是<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%20National%20Park%20Kalbarri%20WA\">卡尔巴里国家公园<\/a>最具代表性的地标——一个天然的心形/拱形岩石窗口，正好框住 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Kalbarri%20WA\">Murchison River<\/a> 在峡谷中蜿蜒流淌的全景，构图绝无仅有<\/span>\n<span class=\"bullet-line\">建议在日出后30–60分钟内到达，金光从岩窗背后透射而来，是摄影的黄金窗口<\/span>\n<span class=\"bullet-line\">从停车场步行至 Nature&#x27;s Window 约1.5–2公里（单程约20分钟），可以继续走到 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Loop%20Trail%20Kalbarri%20WA\">Loop Trail<\/a> 完整环线（约8km · 3–4小时），体力充沛可在此花更多时间<\/span>\n<span class=\"bullet-line\">仅打卡拍照约1.5–2小时，9:30出发前往 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20Kalbarri%20WA\">Z Bend<\/a><\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:828\">🚗 Kalbarri → Nature’s Window停车场 · 38.1 km · 34分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge free\" data-figma-id=\"173:831\">🎫 门票<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:832\">WA国家公园5日通票<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:835\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:836\">日出前后1小时光线最软最美；清晨人少，可慢慢等候光线变化不受打扰<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:839\">早上<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:840\">9:30 – 11:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:842\">🏔️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:844\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20Kalbarri%20WA\">Z Bend<\/a> 峡谷 · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Kalbarri%20WA\">Murchison River<\/a> 大弯道绝壁<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:845\"><span class=\"bullet-line\">Z Bend 是 Murchison River 在红砂岩峡谷中形成的极深&quot;Z&quot;形大弯道，从崖顶俯瞰峡谷深度超过150米，是澳洲西部内陆最壮观的峡谷景观之一<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20Lookout%20Kalbarri%20WA\">Z Bend Lookout<\/a>：停车场步行约10分钟，主观景台可俯瞰峡谷全貌，视觉冲击极强<\/span>\n<span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20River%20Trail%20Kalbarri%20WA\">River Trail<\/a>（可选）：沿悬崖边步道一路延伸，可步行至河床底部近距离感受峡谷内部（单程约2km · 约1小时），需要体力但极值得<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:847\">🚗 Nature’s Window停车场 → Z Bend · 12.3 km · 12分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:850\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:851\">Z Bend 俯瞰—峡谷深度感构图 · 崖边悬空拍弯道全貌 · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20River%20Trail%20Kalbarri%20WA\">River Trail<\/a> 下到底部仰拍绝壁<\/span><\/div><div class=\"note tip\"><span class=\"source-text \" data-figma-id=\"173:853\">💡 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20River%20Trail%20Kalbarri%20WA\">River Trail<\/a> 下行容易上行费力，下峡谷前评估体力；携带足够饮水<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:856\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:857\">11:00 –12:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:859\">🏔️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:861\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hawk%27s%20Head%20Kalbarri%20WA\">Hawk&#x27;s Head<\/a> Lookout · 峡谷全景鸟瞰<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:862\"><span class=\"bullet-line\">Hawk&#x27;s Head 位于峡谷北端，从高处俯瞰 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Kalbarri%20WA\">Murchison River<\/a> 蛇形穿越红砂岩峡谷的完整全景，视角与 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Z%20Bend%20Kalbarri%20WA\">Z Bend<\/a> 互补<\/span>\n<span class=\"bullet-line\">停车场至观景台步行约5分钟，游览约30–45分钟<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:864\">🚗 Z Bend → Hawk’s Head · 53.7 km · 40分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:867\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:868\">河流蛇形峡谷鸟瞰全景 · 红岩层叠纹理特写<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:871\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:872\">13:00 –14:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#fbf1e6\"><span class=\"source-text \" data-figma-id=\"173:874\">🍽️️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:876\">返回 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%2C%20WA\">Kalbarri 镇<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Skywalk%20Caf%C3%A9%20Kalbarri%20WA\">Skywalk Café<\/a> 午餐（可选）或镇内午餐<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:877\">返回镇内午餐，也可在 Skywalk 附近的 Skywalk Café 直接午餐（峡谷景观餐厅，8:00–14:00营业）<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:879\">🚗 Hawk’s Head → Kalbarri镇 · 40.4 km · 32分<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:882\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:883\">15:00 –16:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:885\">🚶<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:887\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%20Skywalk%2C%20WA\">Kalbarri Skywalk<\/a>（Kaju Yatka）· 悬空百米峡谷步道<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:888\"><span class=\"bullet-line\">双悬臂观景平台凌空悬挑于 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Gorge%20Kalbarri%20WA\">Murchison 峡谷<\/a>上方100米：一个延伸25米（超过<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Grand%20Canyon%20Skywalk%20United%20States\">美国大峡谷天空步道<\/a>）、另一个17米，透明网格地板可直接俯视绝壁深渊<\/span>\n<span class=\"bullet-line\">全程无障碍平坦步道，两个平台步行约15–20分钟，停留约1–1.5小时<\/span><\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:890\">🚗 Kalbarri镇 → Skywalk · 37.6 km · 33分；回镇31分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge free\" data-figma-id=\"173:893\">🎫 门票<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:894\">Skywalk 免费 · 使用国家公园通票 · 开放时间 9:00–16:00（建议16:00前离开）<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:897\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:898\">下午阳光将锈红色峡谷壁渲染成油画色调，此时光线从侧面打来，峡谷层叠的纹理质感最为鲜明<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:901\">晚上<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef0f4\"><span class=\"source-text \" data-figma-id=\"173:903\">🏨<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:905\">返回 <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kalbarri%2C%20WA\">Kalbarri 镇<\/a> · 日落晚餐 + 收拾行李<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:906\"><span class=\"bullet-line\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Murchison%20River%20Mouth%20Kalbarri%20WA\">Murchison 河口<\/a>日落（约18:10），之后镇内晚餐，D4需早起，建议21:00前就寝<\/span>\n<span class=\"bullet-line\">加满油、备好次日约590公里长途的零食饮水<\/span><\/span><\/div><div class=\"info-bo ps/search/?api=1&amp;query=Cathedral%20Square%20Christchurch%20Christchurch%20New%20Zealand\">教堂广场<\/a>、<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Avon%20River%20Christchurch%20Christchurch%20New%20Zealand\">雅芳河<\/a>撑篙。沿途可欣赏坎特伯雷平原风光，进入海岸后出现壮丽的凯库拉山脉与大海同框景色。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1286\">🚗 Rolleston住宿 → 24 Moa Rd · 204 km · 2小时43分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1289\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1290\">路过<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheviot%20New%20Zealand\">Cheviot<\/a>镇附近可停车，远眺凯库拉山脉与海岸线。<\/span><\/div><\/div><\/div><div class=\"item fixed\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1293\">中午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1294\">12:00 – 14:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1296\">🎣<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1298\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Kaikoura%2C%20New%20Zealand\">凯库拉<\/a>海钓体验<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1299\">凯库拉深海鱼类丰富，可钓蓝鳕鱼、红鲷鱼等，提供全套装备。<\/span><\/div><div class=\"info-box\"><div class=\"bx-row\"><span class=\"source-text field-copy\" data-figma-id=\"173:1302\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Top%20Catch%20Charters%20Kaikoura%20New%20Zealand\">topcatchcharters<\/a>（官方）<\/span><\/div><div class=\"info-meta\"><span class=\"source-text sou nk\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=178%20Brunells%20Road%20Kaikoura%20New%20Zealand\">178 Brunells Road<\/a>出发，经<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=State%20Highway%201%20New%20Zealand%20New%20Zealand\">SH1<\/a>前往蒂卡波<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20the%20Good%20Shepherd%20Lake%20Tekapo%20New%20Zealand\">好牧羊人教堂<\/a>约410 km / 5小时17分，不含午餐、休息或<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hanmer%20Springs%20New%20Zealand\">Hanmer Springs<\/a>绕行。8:30出发最早约13:47到达。今晚实际住<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Fairlie%20New%20Zealand\">Fairlie<\/a>：观星后从教堂返回<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=9%20Gordon%20Street%20Fairlie%20New%20Zealand\">9 Gordon Street<\/a>约41.6 km / 30分；本日这两段合计451.6 km / 5小时47分。<\/span><\/div><div class=\"chip dist\"><span class=\"source-text \" data-figma-id=\"173:1362\">🚗 凯库拉住宿 → 好牧羊人教堂 · 410 km · 5小时17分<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1365\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1366\">原<a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jacks%20Pass%20New%20Zealand\">Jacks Pass<\/a>拍照点不在本次已核实直达路线中；若保留绕行，需另外计算距离和车程。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1369\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1370\">14:30–17:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eaf3fd\"><span class=\"source-text \" data-figma-id=\"173:1372\">💐<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1374\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=%E8%92%82%E5%8D%A1%E6%B3%A2%E6%B9%96%20Lake%20Tekapo%20New%20Zealand\">蒂卡波湖<\/a> · <a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20the%20Good%20Shepherd%20Lake%20Tekapo%20New%20Zealand\">好牧人教堂<\/a> &amp; 羽扇豆<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1375\">10月初是羽扇豆（Lupin）盛开季！湖边紫粉色羽扇豆配雪山是南岛最经典画面。<\/span><\/div><div class=\"badges\"><span class=\"source-text badge photo\" data-figma-id=\"173:1378\">📸 拍照点<\/span><span class=\"source-text badge-note\" data-figma-id=\"173:1379\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20the%20Good%20Shepherd%20Lake%20Tekapo%20New%20Zealand\">Church of the Good Shepherd<\/a> 教堂湖景角度；教堂右侧山坡俯拍全湖；湖边羽扇豆花田，下午光线侧逆光最美。<\/span><\/div><\/div><\/div><div class=\"item\"><div class=\"time\"><div class=\"p\"><span class=\"source-text \" data-figma-id=\"173:1382\">下午<\/span><\/div><div class=\"r\"><span class=\"source-text \" data-figma-id=\"173:1383\">17:30–19:00<\/span><\/div><\/div><div class=\"icon\" style=\"background:#eef4ea\"><span class=\"source-text \" data-figma-id=\"173:1385\">♨️<\/span><\/div><div class=\"body\"><div class=\"name\"><span class=\"source-text \" data-figma-id=\"173:1387\"><a class=\"addr-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tekapo%20Springs%20Lake%20Tekapo%20New%20Zealand\">Tekapo Springs<\/a> 温泉<\/span><\/div><div class=\"para\"><span class=\"source-text paragraph-copy\" data-figma-id=\"173:1388\">户外温泉泳池，可望雪山和湖景，9–10月气温偏凉，泡温泉体验极佳。<\/span><\/div><div class=\"info-box\">
